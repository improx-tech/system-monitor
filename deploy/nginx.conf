# HTTP Server (Redirects domain to HTTPS, keeps IP access on port 80)
server {
    listen 80;
    server_name monitor.improxtech.com 200.141.2.53;

    client_max_body_size 50M;

    # If accessed via domain name over HTTP, redirect to HTTPS
    if ($host = monitor.improxtech.com) {
        return 301 https://$host$request_uri;
    }

    # Frontend Static Distribution (for direct IP access)
    location / {
        root /root/improx-monitor/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads Static Serving
    location /uploads/ {
        alias /root/improx-monitor/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSockets Engine
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

# HTTPS Server (Secure SSL for monitor.improxtech.com)
server {
    listen 443 ssl;
    server_name monitor.improxtech.com;

    ssl_certificate /etc/letsencrypt/live/monitor.improxtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.improxtech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Frontend Static Distribution
    location / {
        root /root/improx-monitor/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API & Uploads
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploads Static Serving
    location /uploads/ {
        alias /root/improx-monitor/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSockets Engine
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
